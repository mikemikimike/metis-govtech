[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metis-api"
version = "0.1.0"
description = "METIS REST API service"
requires-python = ">=3.11"
dependencies = [
    "metis-core",
    "metis-engine",
    "metis-metrics",
]

[tool.uv.sources]
metis-core = { workspace = true }
metis-engine = { workspace = true }
metis-metrics = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/metis"]
