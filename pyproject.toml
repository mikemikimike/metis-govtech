[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metis"
version = "0.1.0"
description = "Measurement and Evaluation of Trustworthy Intelligent Systems"
requires-python = ">=3.11"
dependencies = [
    "metis-core",
    "metis-engine",
    "metis-library",
    "metis-wizard",
]

[project.scripts]
metis = "metis_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["metis_cli.py"]

[tool.uv]
package = true

[tool.uv.sources]
metis-core = { workspace = true }
metis-engine = { workspace = true }
metis-library = { workspace = true }
metis-wizard = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/*",
    "apps/*",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["packages/*/src", "apps/*/src", "metis_cli.py"]
exclude = ["apps/api", "apps/web"]
reportIncompatibleMethodOverride = false

[tool.ruff]
src = ["packages/*/src", "apps/*/src"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "B008",   # function-call-in-default-argument (Typer pattern)
    "E501",   # line-too-long (formatter enforces line-length)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=9.1.1",
    "ruff>=0.11",
    "jsonschema>=4.20.0",
]
