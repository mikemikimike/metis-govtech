name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/tutorial/**', 'website/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/tutorial/**', 'website/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: make install-docs
      - run: make check-docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  # GitHub Pages on the free plan serves only public repositories.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
