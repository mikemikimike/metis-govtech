[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metis-library"
version = "0.1.4"
description = "Shared catalog of metrics, skills, and reusable components for the METIS evaluation suite"
requires-python = ">=3.11"
dependencies = [
    "metis-core",
    "deepeval>=2.0.0",
    "openai>=1.0.0",
    "typing-extensions",
]

[tool.uv.sources]
metis-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/metis"]
