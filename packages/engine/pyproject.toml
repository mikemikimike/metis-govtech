[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metis-engine"
version = "0.8.0"
description = "Evaluation engine — simulation, metrics, and reporting for METIS"
requires-python = ">=3.11"
dependencies = [
    "metis-core",
    "metis-library",
    "openai>=1.0.0",
    "deepeval>=2.0.0",
    "langfuse>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2",
    "playwright>=1.50.0",
    "tenacity>=8.0.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
metis-engine = "metis.engine.cli:app"

[tool.uv.sources]
metis-core = { workspace = true }
metis-library = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/metis"]
