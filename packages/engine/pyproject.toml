[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metis-engine"
version = "0.1.0"
description = "Evaluation engine and trace parser for METIS"
requires-python = ">=3.11"
dependencies = [
    "metis-core",
    "metis-library",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
metis-engine = "metis.engine.cli:app"

[tool.uv.sources]
metis-core = { workspace = true }
metis-library = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/metis"]
