  - id: corrupted-data
    description: Upload q3_sales_corrupted.csv, which contains missing values, blank region/product cells, and a non-numeric revenue entry. Ask Orca for a standard Q3 revenue analysis by region. Orca should diagnose the data quality issue clearly, stop after a sensible number of retries rather than looping, and report what failed and what the user can do to fix it.
