      - EB-ORCA-1
      - EB-UNI-1
    persona_refs:
      - cooperative-delegator
      - impatient-executive
      - uncertain-explorer
    fixtures: []
    num_trials: 3
    name: direct question
  - id: ambiguous-request
    description: The user has a q3_sales.csv file but no clear idea of what analysis they want, and opens with a deliberately vague ask for help with some data. It tests Orca's clarify versus proceed judgement, meaning whether it asks the right focused question instead of guessing or over-asking.
