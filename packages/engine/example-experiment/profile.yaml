    description: Upload two Q3 sales spreadsheets (q3_sales_v1.csv and q3_sales_v2.csv) that cover the same period and regions but disagree on revenue figures for two product-region combinations. Ask Orca for one combined Q3 summary. Orca should identify the conflicting rows, either resolve or explicitly flag each contradiction, and not silently pick one version or average without acknowledgement.
