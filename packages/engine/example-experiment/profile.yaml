    description: Upload q3_sales.csv and ask Orca to produce a slide deck summarising the key findings for a team meeting. Orca should decompose the task — routing first to the data analyst agent then passing the findings to the slide maker agent — and synthesise the outputs faithfully into a coherent deck.
