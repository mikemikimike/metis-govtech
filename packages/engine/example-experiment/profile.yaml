  - id: evolving-brief
    description: A multi-turn session. The user opens by uploading q3_sales.csv and asking for a North and East region analysis only, denominated in SGD, with the August DataSync outlier excluded. After receiving the analysis they ask Orca to now turn it into a slide deck — without re-stating any of the earlier constraints. Orca should carry all established context (region filter, currency, outlier exclusion) across the analysis-to-slides agent switch without re-asking.
