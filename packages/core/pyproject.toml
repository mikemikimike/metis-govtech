[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "metis-core"
dynamic = ["version"]
description = "Core data models and abstractions for the METIS suite"
requires-python = ">=3.11"
dependencies = []

[tool.hatch.version]
source = "vcs"
raw-options.root = "../.."

[tool.hatch.build.targets.wheel]
packages = ["src/metis"]
