[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metis-wizard"
version = "0.2.2"
description = "Interactive evaluation setup wizard and CLI generator"
requires-python = ">=3.11"
dependencies = [
    "metis-core>=0.3.0",
    "metis-library>=0.1.4",
    # Here for `schemas/experiment.schema.json`, which the compiler validates against and
    # locates relative to the installed module. Nothing is imported from the engine.
    "metis-engine>=0.7.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20.0",
    "openai>=1.40",
    "python-dotenv>=1.0.0",
    # Langfuse's `langfuse.openai` drop-in traces every model call; imported in the gateway. A
    # base dependency, not an extra: the wrapper imports at start and, with no LANGFUSE_* config,
    # disables itself and sends nothing. Server target v3.153.0 uses the Python SDK v3 line.
    "langfuse>=3.0,<4.0",
]

[project.optional-dependencies]
# The web door only. Kept optional so installing the wizard for its CLI does not drag in a
# web framework, and so `adapters/web` stays a removable ownership unit in the dependency
# list as well as in the import graph.
web = [
    "fastapi>=0.110",
    # FastAPI's TestClient uses httpx; keeping it here makes the web adapter testable with the
    # same optional install as the adapter itself.
    "httpx>=0.27",
    "python-multipart>=0.0.18",
    "uvicorn>=0.27",
]

[project.scripts]
metis-wizard = "metis.wizard.bootstrap:cli_app"

[tool.uv.sources]
metis-core = { workspace = true }
metis-library = { workspace = true }
metis-engine = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/metis"]
