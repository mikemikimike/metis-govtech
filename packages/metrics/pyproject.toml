[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metis-metrics"
version = "0.1.0"
description = "Metric definitions and registry for the METIS evaluation suite"
requires-python = ">=3.11"
dependencies = [
    "metis-core",
]

[tool.uv.sources]
metis-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/metis"]
