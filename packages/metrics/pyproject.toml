[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "metis-metrics"
dynamic = ["version"]
description = "Metric definitions and registry for the METIS evaluation suite"
requires-python = ">=3.11"
dependencies = [
    "metis-core",
]

[tool.hatch.version]
source = "vcs"
raw-options.root = "../.."

[tool.uv.sources]
metis-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/metis"]
